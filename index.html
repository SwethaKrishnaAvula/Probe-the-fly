<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Probe the Fly</title>
    <!-- Pixel font is decoration only: without the network the UI falls back to monospace. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="app">
        <div id="brain-pane" class="pane"></div>
        <div id="arena-pane" class="pane"></div>
      </div>
      <div id="brand" role="button" tabindex="0" title="Back to the Discovery Lab (restarts the run)">Probe the Fly</div>
      <div id="hud"></div>
      <div id="notebook" class="hidden"></div>
      <div id="hint">
        <span>drag either screen to turn it &middot; scroll or pinch to zoom</span>
        <span>click the lit hotspot</span>
      </div>
      <div id="overlay" class="hidden"></div>
      <div id="cinematic" class="hidden">
        <div class="cin-caption"></div>
        <button class="cin-skip">Skip &#9654;</button>
        <div class="cin-flash"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
